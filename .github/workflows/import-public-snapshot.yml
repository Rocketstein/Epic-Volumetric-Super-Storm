name: Import sanitized public snapshot

on:
  push:
    branches:
      - automation/public-sanitized-import-20260911
    paths:
      - .public_export/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and install sanitized snapshot
        run: python3 .github/scripts/import_public_snapshot.py

      - name: Commit imported public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sanitized Volumetric Super Storm snapshot"
          git push origin HEAD
